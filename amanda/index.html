<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Guía de sesión — Amanda Giraldo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #3B6D11;
    --green-soft: #ecf3e2;
    --green-line: #c8dba6;
    --orange: #BA7517;
    --orange-soft: #fbf0db;
    --orange-line: #ecd09a;
    --red: #A32D2D;
    --red-soft: #fbe7e5;
    --red-line: #eebebb;
    --blue: #185FA5;
    --blue-soft: #e5edf7;
    --blue-line: #b9cde7;
    --ink: #1f1a14;
    --ink-soft: #4a4339;
    --ink-mute: #8a8278;
    --paper: #fdfbf6;
    --card: #ffffff;
    --line: #ece6da;
    --line-strong: #d8d0bf;
    --shadow: 0 1px 2px rgba(31,26,20,.04), 0 8px 24px -12px rgba(31,26,20,.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Manrope', sans-serif;
    color: var(--ink);
    background: var(--paper);
    line-height: 1.55;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4 { font-family: 'Fraunces', serif; font-weight: 500; letter-spacing: -0.01em; }
  .serif { font-family: 'Fraunces', serif; }
  #root { min-height: 100vh; }
  button { font-family: inherit; }

  /* Print styles */
  @media print {
    @page { margin: 14mm; size: A4; }
    body { background: white; font-size: 11pt; }
    .no-print { display: none !important; }
    .print-only { display: block !important; }
    .tab-section { display: block !important; page-break-before: always; }
    .tab-section:first-of-type { page-break-before: auto; }
    .card, .stat-card { box-shadow: none !important; border: 1px solid var(--line-strong) !important; }
    .nav-tabs { display: none !important; }
    .pager { display: none !important; }
  }
  .print-only { display: none; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Shared UI primitives -->
  <script type="text/babel">
const Card = ({ tone, title, eyebrow, children, style }) => {
  const toneMap = {
    green: { bg: 'var(--green-soft)', border: 'var(--green-line)', accent: 'var(--green)' },
    orange: { bg: 'var(--orange-soft)', border: 'var(--orange-line)', accent: 'var(--orange)' },
    red: { bg: 'var(--red-soft)', border: 'var(--red-line)', accent: 'var(--red)' },
    blue: { bg: 'var(--blue-soft)', border: 'var(--blue-line)', accent: 'var(--blue)' },
    plain: { bg: 'var(--card)', border: 'var(--line)', accent: 'var(--ink)' },
  };
  const t = toneMap[tone || 'plain'];
  return (
    <div className="card" style={{
      background: t.bg,
      border: `1px solid ${t.border}`,
      borderRadius: 18,
      padding: '20px 22px',
      boxShadow: 'var(--shadow)',
      ...style,
    }}>
      {eyebrow && (
        <div style={{
          fontSize: 12,
          fontWeight: 600,
          letterSpacing: '.08em',
          textTransform: 'uppercase',
          color: t.accent,
          marginBottom: 8,
        }}>{eyebrow}</div>
      )}
      {title && <h3 style={{ margin: '0 0 10px', fontSize: 22, color: 'var(--ink)' }}>{title}</h3>}
      {children}
    </div>
  );
};

const Quote = ({ tone, children }) => {
  const toneMap = {
    green: { bg: '#f1f7e6', accent: 'var(--green)' },
    orange: { bg: '#fcf3e1', accent: 'var(--orange)' },
    red: { bg: '#fcebe9', accent: 'var(--red)' },
    blue: { bg: '#ebf2fb', accent: 'var(--blue)' },
    plain: { bg: '#f6f1e7', accent: 'var(--ink-soft)' },
  };
  const t = toneMap[tone || 'plain'];
  return (
    <blockquote style={{
      margin: '14px 0',
      padding: '14px 18px',
      background: t.bg,
      borderLeft: `3px solid ${t.accent}`,
      borderRadius: '4px 12px 12px 4px',
      fontFamily: 'Fraunces, serif',
      fontSize: 18,
      lineHeight: 1.5,
      color: 'var(--ink)',
      fontStyle: 'italic',
      fontWeight: 400,
    }}>{children}</blockquote>
  );
};

const Checklist = ({ items, disabled, storageKey }) => {
  const [checked, setChecked] = React.useState(() => {
    if (!storageKey) return {};
    try { return JSON.parse(localStorage.getItem(storageKey) || '{}'); } catch { return {}; }
  });
  React.useEffect(() => {
    if (storageKey) localStorage.setItem(storageKey, JSON.stringify(checked));
  }, [checked, storageKey]);
  return (
    <ul style={{ listStyle: 'none', padding: 0, margin: '12px 0 0', display: 'grid', gap: 8 }}>
      {items.map((item, i) => {
        const isOn = !!checked[i];
        return (
          <li key={i}>
            <label style={{
              display: 'flex',
              alignItems: 'flex-start',
              gap: 12,
              padding: '10px 12px',
              background: disabled ? '#f3eee5' : (isOn ? '#fff' : 'rgba(255,255,255,.55)'),
              border: `1px solid ${isOn ? 'var(--ink-soft)' : 'var(--line)'}`,
              borderRadius: 10,
              cursor: disabled ? 'not-allowed' : 'pointer',
              transition: 'all .15s ease',
              opacity: disabled ? .55 : 1,
            }}>
              <input
                type="checkbox"
                disabled={disabled}
                checked={isOn}
                onChange={e => setChecked(c => ({ ...c, [i]: e.target.checked }))}
                style={{
                  width: 20, height: 20, marginTop: 1, flexShrink: 0,
                  accentColor: 'var(--green)', cursor: disabled ? 'not-allowed' : 'pointer',
                }}
              />
              <span style={{
                fontSize: 15.5,
                color: 'var(--ink)',
                textDecoration: disabled ? 'line-through' : 'none',
                lineHeight: 1.4,
              }}>{item}</span>
            </label>
          </li>
        );
      })}
    </ul>
  );
};

const TellDoctor = ({ children }) => (
  <div style={{
    marginTop: 14,
    padding: '12px 14px',
    background: '#fff',
    border: '1px dashed var(--blue-line)',
    borderRadius: 10,
    display: 'flex',
    gap: 12,
    alignItems: 'flex-start',
  }}>
    <div style={{
      flexShrink: 0,
      width: 26, height: 26,
      borderRadius: 13,
      background: 'var(--blue-soft)',
      color: 'var(--blue)',
      display: 'grid', placeItems: 'center',
      fontWeight: 700, fontSize: 14,
    }}>→</div>
    <div>
      <div style={{ fontSize: 11.5, fontWeight: 700, color: 'var(--blue)', letterSpacing: '.08em', textTransform: 'uppercase', marginBottom: 2 }}>
        Cuéntele esto al médico
      </div>
      <div style={{ fontFamily: 'Fraunces, serif', fontSize: 16, fontStyle: 'italic', color: 'var(--ink)' }}>
        "{children}"
      </div>
    </div>
  </div>
);

const SectionHeader = ({ number, title, subtitle }) => (
  <header style={{ marginBottom: 28 }}>
    <div style={{
      display: 'flex', alignItems: 'baseline', gap: 14, marginBottom: 6,
    }}>
      <div style={{
        fontFamily: 'Fraunces, serif',
        fontSize: 14, fontWeight: 500,
        color: 'var(--ink-mute)',
        letterSpacing: '.06em',
      }}>SECCIÓN 0{number}</div>
      <div style={{ flex: 1, height: 1, background: 'var(--line)' }}></div>
    </div>
    <h1 style={{ margin: '0 0 6px', fontSize: 38, lineHeight: 1.1, color: 'var(--ink)' }}>{title}</h1>
    {subtitle && <p style={{
      margin: 0, fontSize: 17, color: 'var(--ink-soft)',
      fontFamily: 'Fraunces, serif', fontStyle: 'italic', fontWeight: 400,
    }}>{subtitle}</p>}
  </header>
);

Object.assign(window, { Card, Quote, Checklist, TellDoctor, SectionHeader });
  </script>

  <!-- Section 1: Dolor en los pies -->
  <script type="text/babel">
const CauseCard = ({ number, name, tone, description, checklist, doctor, disabled, status }) => {
  const accent = {
    blue: 'var(--blue)', orange: 'var(--orange)', green: 'var(--green)', red: 'var(--red)', mute: 'var(--ink-mute)',
  }[tone] || 'var(--ink)';
  return (
    <div className="card" style={{
      background: disabled ? '#f7f3ea' : 'var(--card)',
      border: `1px solid ${disabled ? 'var(--line)' : 'var(--line-strong)'}`,
      borderRadius: 18,
      padding: '22px 24px',
      boxShadow: disabled ? 'none' : 'var(--shadow)',
      opacity: disabled ? .72 : 1,
    }}>
      <div style={{ display: 'flex', alignItems: 'baseline', gap: 14, marginBottom: 4 }}>
        <div style={{
          fontFamily: 'Fraunces, serif',
          fontSize: 36,
          color: accent,
          lineHeight: 1,
          fontWeight: 500,
        }}>0{number}</div>
        <div style={{ flex: 1 }}>
          <h3 style={{ margin: 0, fontSize: 22, color: 'var(--ink)' }}>{name}</h3>
        </div>
        {status && (
          <span style={{
            fontSize: 11.5,
            fontWeight: 700,
            letterSpacing: '.1em',
            padding: '5px 10px',
            borderRadius: 999,
            background: 'var(--green-soft)',
            color: 'var(--green)',
            border: '1px solid var(--green-line)',
          }}>{status}</span>
        )}
      </div>
      <p style={{ margin: '6px 0 4px', color: 'var(--ink-soft)', fontSize: 15.5 }}>{description}</p>
      <Checklist items={checklist} disabled={disabled} storageKey={`amanda-checklist-${number}`} />
      {doctor && <TellDoctor>{doctor}</TellDoctor>}
    </div>
  );
};

const Section1 = () => (
  <div>
    <SectionHeader number="1" title="Dolor en los pies" subtitle="Lo que nos preocupa hoy" />

    <Card tone="orange" eyebrow="Antes que nada" style={{ marginBottom: 22 }}>
      <h3 style={{ margin: '0 0 10px', fontSize: 24, color: 'var(--ink)' }}>
        Hay algo más importante que encontrar el origen del dolor
      </h3>
      <p style={{ margin: '0 0 10px', fontSize: 16, color: 'var(--ink)', lineHeight: 1.65 }}>
        Detrás del dolor en los pies, y detrás de los triglicéridos altos, el HDL bajo y la glucosa en
        límite, hay un hilo común: <strong>inflamación</strong>.
      </p>
      <p style={{ margin: '0 0 10px', fontSize: 16, color: 'var(--ink-soft)', lineHeight: 1.65 }}>
        La inflamación es como un <em>fuego lento</em> que el cuerpo tiene encendido todo el tiempo sin que
        uno lo sienta directamente. No duele como una herida, pero va dañando por dentro poco a poco.
      </p>
      <p style={{ margin: 0, fontSize: 16, color: 'var(--ink)', lineHeight: 1.65 }}>
        Cuando trabajamos en bajar esa inflamación, <strong>todo lo demás mejora</strong>: los exámenes, el
        dolor, la energía, la presión. Eso es exactamente lo que estamos haciendo juntos.
      </p>
    </Card>

    <Card tone="green" eyebrow="Buena noticia" style={{ marginBottom: 22 }}>
      <div style={{ display: 'flex', gap: 16, alignItems: 'flex-start' }}>
        <div style={{
          flexShrink: 0,
          fontFamily: 'Fraunces, serif',
          fontSize: 44,
          color: 'var(--green)',
          lineHeight: 1,
          marginTop: -4,
        }}>✓</div>
        <div>
          <h3 style={{ margin: '0 0 6px', fontSize: 24, color: 'var(--ink)' }}>
            El ácido úrico salió normal — no es gota.
          </h3>
          <p style={{ margin: 0, fontSize: 16, color: 'var(--ink-soft)' }}>
            Su resultado: <strong style={{ color: 'var(--green)' }}>4.2 mg/dL</strong>, en la mitad del rango normal.
            Puede tachar esa preocupación de la lista.
          </p>
        </div>
      </div>
    </Card>

    <Card style={{ marginBottom: 28 }}>
      <h3 style={{ margin: '0 0 8px', fontSize: 20 }}>¿Qué es el ácido úrico y la gota?</h3>
      <p style={{ margin: 0, fontSize: 16, color: 'var(--ink-soft)', lineHeight: 1.6 }}>
        El ácido úrico es una sustancia que el cuerpo produce al procesar ciertos alimentos. Cuando está muy
        alto, puede formar cristalitos en las articulaciones — eso se llama <em>gota</em> y duele muchísimo,
        especialmente en el dedo gordo del pie. El suyo está en 4.2, que es completamente normal.
        Así que el dolor tiene otra causa que vamos a explorar.
      </p>
    </Card>

    <div style={{
      display: 'flex', alignItems: 'center', gap: 14, marginBottom: 18,
    }}>
      <h2 style={{ margin: 0, fontSize: 24 }}>Posibles causas del dolor</h2>
      <div style={{ flex: 1, height: 1, background: 'var(--line)' }}></div>
      <span style={{ fontSize: 13, color: 'var(--ink-mute)' }}>
        Marque lo que sienta. Lo lleva a la consulta.
      </span>
    </div>

    <div style={{ display: 'grid', gap: 18 }}>
      <CauseCard
        number={1}
        tone="blue"
        name="Neuropatía periférica"
        description="Daño leve en los nervios, frecuente cuando los triglicéridos están altos y la glucosa lleva tiempo en el límite."
        checklist={[
          'Ardor o quemazón en los pies',
          'Hormigueo o cosquilleo',
          'Pie dormido sin razón',
          'Dolor que empeora en la noche',
          'Sensación de caminar sobre algo',
        ]}
        doctor="Siento ardor y hormigueo, especialmente de noche"
      />
      <CauseCard
        number={2}
        tone="orange"
        name="Fascitis plantar"
        description="Inflamación de la membrana que recubre la planta del pie. Muy común después de los 50."
        checklist={[
          'Dolor fuerte al dar los primeros pasos en la mañana',
          'Dolor en el talón',
          'Mejora después de caminar un rato',
          'Empeora después de estar mucho tiempo de pie',
          'Dolor al subir escaleras',
        ]}
        doctor="Me duele el talón al levantarme, los primeros pasos son los peores"
      />
      <CauseCard
        number={3}
        tone="red"
        name="Circulación venosa"
        description="Cuando el colesterol bueno (HDL) está bajo y los triglicéridos altos, la sangre puede fluir con más dificultad."
        checklist={[
          'Pies o tobillos hinchados al final del día',
          'Sensación de pesadez en las piernas',
          'Varices visibles',
          'Pies fríos frecuentes',
          'Calambres nocturnos',
        ]}
        doctor="Siento los pies pesados e hinchados al final del día"
      />
      <CauseCard
        number={4}
        tone="mute"
        name="Gota / ácido úrico"
        description="Descartada por el examen. Se incluye aquí para que quede claro por qué no es esta."
        checklist={[
          'Dolor muy intenso repentino',
          'Inflamación y calor en el dedo gordo',
          'Enrojecimiento local',
        ]}
        disabled
        status="DESCARTADA"
      />
    </div>
  </div>
);

window.Section1 = Section1;
  </script>

  <!-- Section 2: Lo que ya hemos logrado -->
  <script type="text/babel">
const Achievement = ({ number, title, children }) => (
  <div className="card" style={{
    background: 'var(--card)',
    border: '1px solid var(--line)',
    borderRadius: 16,
    padding: '18px 20px',
    display: 'flex',
    gap: 16,
    alignItems: 'flex-start',
    boxShadow: 'var(--shadow)',
  }}>
    <div style={{
      flexShrink: 0,
      width: 42, height: 42, borderRadius: 21,
      background: 'var(--green-soft)',
      border: '1px solid var(--green-line)',
      color: 'var(--green)',
      display: 'grid', placeItems: 'center',
      fontFamily: 'Fraunces, serif',
      fontWeight: 600,
      fontSize: 22,
    }}>✓</div>
    <div style={{ flex: 1 }}>
      <div style={{
        fontSize: 11, fontWeight: 700, letterSpacing: '.12em',
        textTransform: 'uppercase', color: 'var(--green)', marginBottom: 2,
      }}>Logro 0{number}</div>
      <h3 style={{ margin: '0 0 6px', fontSize: 19, lineHeight: 1.25 }}>{title}</h3>
      <p style={{ margin: 0, color: 'var(--ink-soft)', fontSize: 15.5, lineHeight: 1.55 }}>{children}</p>
    </div>
  </div>
);

const Section2 = () => (
  <div>
    <SectionHeader
      number="2"
      title="Lo que ya hemos logrado"
      subtitle="3 meses de trabajo — los cambios que usted ya hizo son los que van a mover los exámenes. Solo necesitan más tiempo."
    />

    <Card style={{ marginBottom: 24 }}>
      <p style={{ margin: 0, fontSize: 16.5, lineHeight: 1.7, color: 'var(--ink)' }}>
        Amanda, llevamos <strong>tres meses trabajando juntos</strong>. Ha sido un proceso con calma, paso a
        paso. Y aunque los exámenes todavía no muestran todo lo que ha cambiado, <em>su cuerpo sí lo está
        sintiendo</em>. Estos son los cambios reales que ya hizo:
      </p>
    </Card>

    <div style={{
      display: 'grid',
      gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))',
      gap: 14,
      marginBottom: 24,
    }}>
      <Achievement number={1} title="Fruta controlada">
        Antes comía fruta en exceso durante el día. Hoy la limita a <strong>1 fruta al día</strong>.
      </Achievement>
      <Achievement number={2} title="Menos carbohidratos">
        Antes el consumo de carbohidratos era muy alto. Con el tiempo se ha ido reduciendo.
      </Achievement>
      <Achievement number={3} title="Nada de jugos ni bebidas dulces">
        Antes tomaba jugos, agua de panela y bebidas azucaradas a diario. <strong>Hoy no los consume</strong>.
      </Achievement>
      <Achievement number={4} title="El maduro ya no es costumbre">
        Antes era una de sus comidas más frecuentes. Hoy lo come de vez en cuando, y ese día no come fruta.
      </Achievement>
      <Achievement number={5} title="Sin procesados, poco arroz">
        Su alimentación es limpia. No agrega productos procesados y el arroz es ocasional.
      </Achievement>
      <Achievement number={6} title="Ajuste en los frijoles">
        Estaba comiendo una taza al día. Vamos a bajar a media taza y agregar más fibra soluble: chía,
        linaza o avena.
      </Achievement>
    </div>

    <Card tone="blue" style={{ marginBottom: 22 }}>
      <div style={{ display: 'flex', gap: 14, alignItems: 'flex-start' }}>
        <div style={{
          flexShrink: 0,
          fontFamily: 'Fraunces, serif',
          fontSize: 36, color: 'var(--blue)', lineHeight: 1, marginTop: -2,
        }}>⏳</div>
        <div>
          <h3 style={{ margin: '0 0 8px', fontSize: 21 }}>Los exámenes tardan en reflejar los cambios</h3>
          <p style={{ margin: 0, fontSize: 16, color: 'var(--ink)', lineHeight: 1.6 }}>
            El cuerpo necesita entre <strong>3 y 6 meses</strong> de alimentación consistente para mostrar
            resultados visibles en sangre. Lo que usted ya hizo es <strong>exactamente lo correcto</strong>.
            <span style={{ fontFamily: 'Fraunces, serif', fontStyle: 'italic', color: 'var(--blue)' }}> Seguimos.</span>
          </p>
        </div>
      </div>
    </Card>

    <Card eyebrow="Coprológico — octubre 2025">
      <h3 style={{ margin: '0 0 8px', fontSize: 20 }}>Lo que decían sus heces hace tres meses</h3>
      <p style={{ margin: 0, fontSize: 15.5, color: 'var(--ink-soft)', lineHeight: 1.6 }}>
        En octubre sus heces mostraron <strong>almidones +++</strong> y <strong>flora bacteriana aumentada
        con levaduras ++</strong>. Eso nos dijo que su intestino venía de años procesando muchos carbohidratos
        y tenía un desequilibrio en las bacterias. Los cambios que ha hecho en estos tres meses están
        ayudando a corregir eso <em>desde adentro</em>.
      </p>
    </Card>
  </div>
);

window.Section2 = Section2;
  </script>

  <!-- Section 3: El estrés también es parte del cuadro -->
  <script type="text/babel">
const StressAction = ({ number, title, children }) => (
  <div className="card" style={{
    background: 'var(--card)',
    border: '1px solid var(--line-strong)',
    borderRadius: 16,
    padding: '18px 20px',
    display: 'flex',
    gap: 16,
    boxShadow: 'var(--shadow)',
  }}>
    <div style={{
      flexShrink: 0,
      width: 44, height: 44, borderRadius: 22,
      background: '#fff', border: '1px solid var(--line-strong)',
      display: 'grid', placeItems: 'center',
      fontFamily: 'Fraunces, serif', fontWeight: 500, fontSize: 22,
      color: 'var(--ink-soft)',
    }}>{number}</div>
    <div>
      <h3 style={{ margin: '0 0 6px', fontSize: 19, lineHeight: 1.25 }}>{title}</h3>
      <p style={{ margin: 0, color: 'var(--ink-soft)', fontSize: 15.5, lineHeight: 1.6 }}>{children}</p>
    </div>
  </div>
);

const Section3 = () => (
  <div>
    <SectionHeader
      number="3"
      title="El estrés también es parte del cuadro"
      subtitle="No es solo la alimentación"
    />

    <Card style={{ marginBottom: 22 }}>
      <p style={{ margin: 0, fontSize: 16.5, lineHeight: 1.7, color: 'var(--ink)' }}>
        Amanda, hay algo que queremos reconocer antes de seguir. Usted no solo está trabajando en su
        alimentación — también está cargando con el cuidado de su mamá, que tiene más de 90 años y en
        estos días no ha estado bien. <strong>Eso pesa.</strong> Y el cuerpo lo siente.
      </p>
    </Card>

    <Card style={{ marginBottom: 22 }}>
      <h3 style={{ margin: '0 0 10px', fontSize: 22 }}>¿Qué es el cortisol?</h3>
      <p style={{ margin: '0 0 10px', fontSize: 16, color: 'var(--ink-soft)', lineHeight: 1.65 }}>
        Cuando una persona está bajo estrés constante — preocupada, sin descansar bien, pensando
        demasiado — el cuerpo produce una hormona llamada <strong>cortisol</strong>. Esa hormona es útil
        en momentos de peligro real, pero cuando está alta todo el tiempo <strong>hace daño</strong>:
      </p>

  <!-- Main App -->
  <script type="text/babel">
const TABS = [
  { n: 1, label: 'Dolor en los pies',          short: 'Dolor' },
  { n: 2, label: 'Lo que ya logramos',         short: 'Logros' },
  { n: 3, label: 'El estrés y su cuerpo',      short: 'Estrés' },
  { n: 4, label: 'Comparativo de exámenes',    short: 'Exámenes' },
  { n: 5, label: '¿Qué significa?',             short: 'Significa' },
  { n: 6, label: 'Plan nutricional',           short: 'Plan' },
  { n: 7, label: 'Cita médica',                short: 'Cita' },
];

const App = () => {
  const [active, setActive] = React.useState(() => {
    const h = parseInt((window.location.hash || '').replace('#s', ''), 10);
    return (h >= 1 && h <= 7) ? h : 1;
  });
  const scrollRef = React.useRef(null);

  React.useEffect(() => {
    window.location.hash = `s${active}`;
    if (scrollRef.current) scrollRef.current.scrollTo({ top: 0, behavior: 'smooth' });
  }, [active]);

  const sections = [Section1, Section2, Section3, Section4, Section5, Section6, Section7];
  const Current = sections[active - 1];

    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', background: 'var(--paper)' }}>

              <div style={{ fontSize: 14, color: 'var(--ink-soft)', marginTop: 4 }}>
                58 años · Mujer · Mayo 2026
              </div>
            </div>
            <div style={{ textAlign: 'right', fontSize: 13, color: 'var(--ink-soft)' }}>
              <div style={{ fontFamily: 'Fraunces, serif', fontSize: 17, color: 'var(--ink)', fontWeight: 500 }}>
                Luis Fernández
              </div>
              <div>Médico · KiwiForLife</div>
            </div>
          </div>
        </div>

          maxWidth: 980, margin: '0 auto', padding: '0 16px',
          display: 'flex', gap: 4, overflowX: 'auto',
          borderTop: '1px solid var(--line)',
        }}>
          {TABS.map(t => {
            const on = active === t.n;
            return (
              <button
                key={t.n}
                onClick={() => setActive(t.n)}
                style={{
                  background: 'transparent',
                  border: 'none',
                  borderBottom: on ? '2px solid var(--green)' : '2px solid transparent',
                  padding: '14px 14px 12px',
                  cursor: 'pointer',
                  fontSize: 14.5,
                  fontWeight: on ? 700 : 500,
                  color: on ? 'var(--green)' : 'var(--ink-soft)',

                  alignItems: 'center',

                }}

                <span style={{
                  display: 'inline-grid', placeItems: 'center',
                  width: 22, height: 22, borderRadius: 11,
                  background: on ? 'var(--green)' : 'var(--line)',
                  color: on ? '#fff' : 'var(--ink-soft)',
                  fontSize: 12, fontWeight: 700,
                  fontFamily: 'Manrope, sans-serif',
                }}>{t.n}</span>
                <span className="tab-label-full">{t.label}</span>
                <span className="tab-label-short">{t.short}</span>

            borderTop: '1px solid var(--line)',

                background: 'transparent',
                border: '1px solid var(--line-strong)',
                padding: '10px 16px',
                borderRadius: 10,

                opacity: active === 1 ? .4 : 1,
                fontSize: 14.5,
                fontWeight: 600,
                color: 'var(--ink-soft)',
                display: 'flex', alignItems: 'center', gap: 8,

              onClick={() => setActive(a => Math.min(7, a + 1))}

                padding: '10px 16px',

                cursor: active === 7 ? 'not-allowed' : 'pointer',

          </div>
        </div>
      </footer>

      <style>{`
        .tab-label-short { display: none; }

          .tab-label-full { display: none; }
          .tab-label-short { display: inline; }
          .nav-tabs button { padding: 12px 10px !important; }

        @media print {
          .screen-only-active .tab-section { display: block !important; page-break-before: always; }
          .screen-only-active .tab-section:first-child { page-break-before: auto; }
        }
      `}</style>
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
